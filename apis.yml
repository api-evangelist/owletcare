aid: owletcare
name: Owletcare
description: >-
  Owlet (Owletcare) is a baby-monitoring technology company that builds
  connected-nursery hardware and companion apps for parents. Its flagship
  Dream Sock is marketed as an FDA-cleared smart baby monitor that tracks a
  sleeping infant's pulse rate, oxygen levels, movement and sleep patterns,
  alongside the Dream Sight HD video monitor and the combined Dream Duo
  system. Products pair a wearable/camera with the Owlet Dream mobile app for
  real-time wellness insights and notifications. The consumer storefront at
  owletcare.com runs on Shopify; sign-in is handled by Shopify's Customer
  Account API (OIDC/OAuth), and Owlet does not currently publish a
  first-party developer API program. This profile was surfaced as a Techstars
  portfolio company and enriched from Owlet's public web surface.
